name: Build Flutter APK & Get License

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: 'app_code'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate License Key for your Device
        run: |
          # حساب الرمز لهاتفك B014-54E1
          DEVICE_ID="B014-54E1"
          CLEAN_ID=$(echo $DEVICE_ID | tr -d '-')
          
          python3 -c "
          clean_id = '${CLEAN_ID}'
          hash = 0
          for char in clean_id:
              hash = ((hash << 5) - hash) + ord(char)
              hash = hash & 0xFFFFFFFF
          hash = hash ^ 0x2008009
          hash = hash * 31
          hex_val = hex(abs(hash))[2:].upper().zfill(8)
          print(f'=====================================')
          print(f'License Key for Device ${DEVICE_ID}:')
          print(f'M{hex_val[:3]}-{hex_val[3:7]}')
          print(f'=====================================')
          "

      - name: Create Full Flutter Project & Fix Kotlin
        run: |
          flutter create mamax_app
          rm -rf mamax_app/lib
          cp -r app_code/lib mamax_app/lib
          cp app_code/pubspec.yaml mamax_app/pubspec.yaml
          if [ -d "app_code/assets" ]; then cp -r app_code/assets mamax_app/assets; fi
          
          cd mamax_app/android
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.22"/' build.gradle || true
          sed -i 's/id "org.jetbrains.kotlin.android" version .*/id "org.jetbrains.kotlin.android" version "1.9.22" apply false/' settings.gradle || true
          
          cd ..
          flutter pub get
          if grep -q "flutter_launcher_icons" pubspec.yaml; then dart run flutter_launcher_icons; fi

      - name: Build APK (Release)
        run: |
          cd mamax_app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mamax-release-apk
          path: mamax_app/build/app/outputs/flutter-apk/app-release.apk
